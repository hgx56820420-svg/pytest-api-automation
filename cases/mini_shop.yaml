    expected: "恰好 1 个 201、4 个 400；used_count == 1；订单表中带该券的订单 1 条；库存只减 1"
    testable: api
  - id: TC-COUPON-011
    test_points: [TP-COUPON-08-01]
    title: 达到使用次数后状态为 exhausted
    steps: ["创建 max_uses=2 的券", "买家下单使用 1 次，查询券", "再下单使用 1 次，查询券"]
    expected: "第 1 次后 status == active、used_count == 1；第 2 次后 status == exhausted、used_count == 2"
    testable: api
  - id: TC-COUPON-012
    test_points: [TP-COUPON-09-01, TP-COUPON-09-02]
    title: 取消使用优惠券的订单
    steps: ["创建 max_uses=1 的券，买家带券下单使其 exhausted，记录下单前余额 B", "取消该订单", "另一买家带券下单"]
    expected: "取消后 used_count == 0，status == active，余额 == B（未支付无退款）；再次带券下单 201"
    testable: api
  - id: TC-COUPON-013
    test_points: [TP-COUPON-10-01]
    title: 其他前置条件失败时券次数不变
    steps: ["创建有效券", "带券分别对库存不足、已下架商品下单"]
    expected: "均 400；used_count 与 status 不变；库存、余额、订单数不变"
    testable: api
  - id: TC-INV-001
    test_points: [TP-INV-01-01, TP-INV-01-02]
    title: 下单产生扣减流水
    steps: ["管理员创建商品，记录该商品流水数", "买家下单 3 件", "GET /api/inventory/{product_id}/transactions"]
    expected: "200；流水数 +1；新流水 product_id 正确，quantity_change == -3，reason == order_created"
    testable: api
  - id: TC-INV-002
    test_points: [TP-INV-02-01, TP-INV-02-02]
    title: 取消产生恢复流水
    steps: ["买家下单 3 件后取消", "查询该商品流水"]
    expected: "新增一条 quantity_change == 3，reason == order_cancelled，reference_id == 订单 id；该商品流水 quantity_change 之和 == 0"
    testable: api
  - id: TC-INV-003
    test_points: [TP-INV-03-01]
    title: 失败操作不产生流水
    steps: ["记录商品流水数", "依次执行库存不足下单、下架商品下单、耗尽券下单、重复支付、取消已支付订单、取消已取消订单"]
    expected: "每步失败后流水数与该步之前相同（仅前置成功的下单/取消产生流水）"
    testable: api
  - id: TC-INV-004
    test_points: [TP-INV-04-01]
    title: 流水只返回指定商品
    steps: ["对商品 A 和 B 各下单一次", "查询 A 的流水"]
    expected: "200；所有记录 product_id == A，不含 B 的流水"
    testable: api
  - id: TC-INV-005
    test_points: [TP-INV-04-02]
    title: 流水查询需登录
    steps: ["不带 Token GET /api/inventory/{product_id}/transactions"]
    expected: "401"
    testable: api
  - id: TC-INV-006
    test_points: [TP-INV-04-03]
    title: 流水查询商品不存在或 ID 非法
    steps: ["登录后查询不存在的商品流水", "查询 product_id=abc"]
    expected: "前者 404；后者 422"
    testable: api
  - id: TC-SEC-001
    test_points: [TP-SEC-01-01]
    title: 拒绝其他服务签发的 Token
    steps: ["用测试密钥分别构造 aud=other-service、缺 aud、缺 exp 的 JWT", "用随机密钥签名一个 aud=mini-shop 的 JWT", "分别调用 GET /api/auth/me"]
    expected: "均 401，WWW-Authenticate == Bearer"
    testable: api
  - id: TC-SEC-002
    test_points: [TP-SEC-02-01]
    title: 密码加盐哈希
    steps: ["用相同密码注册两个用户", "读取两行 password_hash"]
    expected: "两个 password_hash 不相同；格式标识为 PBKDF2-SHA256（如 pbkdf2_sha256 前缀）且含盐段"
    testable: api
  - id: TC-SEC-003
    test_points: [TP-SEC-03-01]
    title: 响应不泄露密码
    steps: ["注册、登录、GET me、下单、GET 订单、GET 购物车，收集所有响应体"]
    expected: "所有响应 JSON 中无 password、password_hash 键，响应文本不含明文密码和数据库中的哈希值"
    testable: api
  - id: TC-SEC-004
    test_points: [TP-SEC-04-01]
    title: 测试证据不含敏感信息
    steps: ["执行完整测试后检查报告与证据目录", "搜索 access_token 值、测试密码、数据库连接串"]
    expected: "均未出现，或已脱敏"
    testable: manual
    reason: 检查对象是测试框架产出的报告文件，不是被测接口行为
  - id: TC-SEC-005
    test_points: [TP-SEC-05-01]
    title: 未配置密钥时每次启动随机生成
    steps: ["不设置 APP_SECRET_KEY 启动服务并登录取 token", "重启服务", "用旧 token 调用 GET /api/auth/me", "审查代码中无硬编码密钥"]
    expected: "重启后旧 token 返回 401；代码中无常量密钥"
    testable: manual
    reason: 需要控制服务启动配置并重启服务，且包含代码审查
  - id: TC-TRACE-001
    test_points: [TP-TRACE-01-01]
    title: 运行时契约与基线一致
    steps: ["GET /openapi.json", "与 contracts/mini_shop.openapi.json 比较路径、方法、必填字段"]
    expected: "200；无删除的路径/方法，无新增必填字段等破坏性变化"
    testable: api
  - id: TC-TRACE-002
    test_points: [TP-TRACE-02-01]
    title: 缺少证据时结论为 INCONCLUSIVE
    steps: ["构造一个关键业务用例的执行记录，删除数据库 before/after 快照", "生成报告"]
    expected: "报告结论为 INCONCLUSIVE，不为 PASS"
    testable: manual
    reason: 验证对象是测试报告生成流程，不是被测服务接口
  - id: TC-TRACE-003
    test_points: [TP-TRACE-03-01]
    title: 测试请求携带唯一 request_id
    steps: ["执行一次包含多个接口用例的测试运行", "检查报告证据中的每条 HTTP 请求记录"]
    expected: "每条请求记录都有 request_id；同一次运行内 request_id 无重复"
    testable: manual
    reason: 验证对象是测试框架和报告证据，不是被测服务接口

















