    steps: ["管理员创建商品并下架", "记录库存、余额、订单数", "买家下单 1 件"]
    expected: "400，detail == Product is not on sale；库存、余额、订单数不变"
    testable: api
  - id: TC-ORDER-007
    test_points: [TP-ORDER-05-01, TP-ORDER-08-01]
    title: 库存边界
    steps: ["管理员创建 price=1 stock=3 的商品", "买家 A 购买 4 件", "买家 A 购买 3 件", "买家 B 购买 1 件"]
    expected: "购买 4 件 400 Insufficient stock 且库存、余额、订单数不变；购买 3 件 201 且库存变 0；库存 0 时购买 1 件 400 Insufficient stock 且数据不变"
