  - id: TC-PRODUCT-008
    test_points: [TP-PRODUCT-05-01, TP-PRODUCT-05-03]
    title: 创建商品字段边界
    steps: ["管理员分别创建 name 长度 1 和 100、price=0.01、stock=0 的商品", "分别创建 name 为空串、长度 101、price=0、price=-1、stock=-1 的商品", "每次记录 products 行数"]
    expected: "合法边界均 201；非法值均 422 且 products 行数不变"
    testable: api
  - id: TC-PRODUCT-009
    test_points: [TP-PRODUCT-05-02, TP-PRODUCT-05-03]
    title: 创建商品缺字段或类型错误
    steps: ["管理员分别发送缺 name、缺 price、缺 stock、price=abc、stock=1.5 的请求"]
    expected: "均 422；products 行数不变"
    testable: api
  - id: TC-PRODUCT-010
    test_points: [TP-PRODUCT-06-01, TP-PRODUCT-06-02]
    title: 部分字段更新
    steps: ["管理员创建商品 name=A price=10 stock=5", "PUT 只提交 price=20", "PUT 只提交 stock=8", "PUT 只提交 name=B"]
    expected: "每次 200；每次只有提交的字段变化，其余字段与上一次数据库值相同；最终 name=B price=20 stock=8 status=on_sale"
    testable: api
  - id: TC-PRODUCT-011
    test_points: [TP-PRODUCT-07-01, TP-PRODUCT-07-02]
    title: 更新不存在商品或非法字段
    steps: ["管理员 PUT 不存在的 product_id", "对已有商品分别 PUT price=0、stock=-1、name 为空串、status=deleted"]
    expected: "不存在返回 404；非法字段均 422；已有商品数据库各字段不变"
    testable: api
  - id: TC-PRODUCT-012
    test_points: [TP-PRODUCT-08-01, TP-PRODUCT-08-02]
    title: 管理员下架商品
    steps: ["管理员创建商品并记录 products 行数", "DELETE /api/products/{id}", "GET 详情和 status=off_sale 列表"]
    expected: "DELETE 200 且 status == off_sale；products 行数不变，该行仍存在且 status=off_sale；详情 200，off_sale 列表包含该商品"
    testable: api
  - id: TC-PRODUCT-013
    test_points: [TP-PRODUCT-09-01]
    title: 下架后历史订单仍有效
    steps: ["买家对商品下单", "管理员下架该商品", "买家 GET 订单详情和订单列表"]
    expected: "均 200；订单 product_id、amount、status 不变"
    testable: api
  - id: TC-PERM-001
    test_points: [TP-PERM-01-01]
    title: 注册用户不是管理员
    steps: ["注册新用户并登录", "调用 POST /api/products"]
    expected: "403；products 行数不变"
    testable: api
  - id: TC-PERM-002
    test_points: [TP-PERM-02-01, TP-PERM-02-02]
    title: 普通用户创建商品
    steps: ["记录 products 行数", "普通用户 POST /api/products 合法请求体"]
    expected: "403；products 行数不变"
    testable: api
  - id: TC-PERM-003
    test_points: [TP-PERM-03-01, TP-PERM-03-02]
    title: 普通用户更新商品
    steps: ["管理员创建商品", "普通用户 PUT price=1、stock=999"]
    expected: "403；数据库 name/price/stock/status 不变"
    testable: api
  - id: TC-PERM-004
    test_points: [TP-PERM-04-01, TP-PERM-04-02]
    title: 普通用户下架商品
    steps: ["管理员创建商品", "普通用户 DELETE /api/products/{id}"]
    expected: "403；数据库 status 仍为 on_sale"
    testable: api
  - id: TC-PERM-005
    test_points: [TP-PERM-05-01, TP-PERM-05-02]
    title: 普通用户创建优惠券
    steps: ["记录 coupons 行数", "普通用户 POST /api/coupons code=随机大写 discount_percent=10 max_uses=1"]
