service: mini_shop
source: docs/MINI_SHOP_API_REQUIREMENTS.md

# ① 需求规则
rules:
  - id: R-META-01
    text: GET /health 无需认证，返回 200 且 status=ok
    quote: "服务启动完成后返回 `200`。"
    api: GET /health
  - id: R-META-02
    text: 注册、商品、订单等响应中的 created_at 等时间字段为 ISO 8601 日期时间字符串
    quote: "时间字段使用 ISO 8601 日期时间字符串。"
    api: GET /api/orders/{order_id}
  # ---------- AUTH ----------
  - id: R-AUTH-01
    text: 注册成功返回 201，响应含 id/username/balance/created_at，余额等于默认余额 1000.00，数据库新增一条用户
    quote: "注册成功后用户余额等于配置的默认余额。"
    api: POST /api/auth/register
  - id: R-AUTH-02
    text: username 长度 3–20、password 长度 6–32，越界或缺字段返回 422，不新增用户
    quote: "用户名或密码长度不合法"
    api: POST /api/auth/register
  - id: R-AUTH-03
    text: 用户名重复注册返回 409 Username already exists，不新增重复用户
    quote: "用户名在数据库中唯一。"
    api: POST /api/auth/register
  - id: R-AUTH-04
    text: 密码以哈希保存，数据库和响应中不出现明文密码
    quote: "密码必须以哈希形式保存，不得保存或返回明文。"
    api: POST /api/auth/register
  - id: R-AUTH-05
    text: 用户名密码正确时登录返回 200，含 access_token 且 token_type=bearer，无业务数据变化
    quote: "验证用户名和密码，返回 Bearer Token。"
    api: POST /api/auth/login
  - id: R-AUTH-06
    text: 用户不存在与密码错误均返回 401 Incorrect username or password，响应完全相同
    quote: "用户不存在和密码错误必须返回相同错误，避免泄露已注册用户名。"
    api: POST /api/auth/login
  - id: R-AUTH-07
    text: 登录请求体缺字段或类型错误返回 422
    quote: "请求体缺少字段或类型不合法"
    api: POST /api/auth/login
  - id: R-AUTH-08
    text: GET /api/auth/me 返回当前 Token 用户的公开字段，不含 password_hash
    quote: "返回 `User` 的公开字段，不得返回 `password_hash`。"
    api: GET /api/auth/me
  - id: R-AUTH-09
    text: Token 缺失、格式错误、签名错误、过期或用户不存在时返回 401，带 WWW-Authenticate Bearer 头，detail=Invalid or missing credentials
    quote: "Token 缺失、格式错误、签名错误、过期或用户不存在时，系统返回："
    api: GET /api/auth/me
  - id: R-AUTH-10
    text: Token 默认有效期 60 分钟，过期后返回 401
    quote: "默认 Token 有效期为 60 分钟，可通过环境配置修改。"
    api: GET /api/auth/me
  # ---------- PRODUCT ----------
  - id: R-PRODUCT-01
    text: 商品列表无需认证，默认 page=1、size=10，page>=1、1<=size<=100，越界返回 422；响应含 total/page/size/items
    quote: "列表响应统一包含 `total`、`page`、`size` 和 `items`。"
    api: GET /api/products
  - id: R-PRODUCT-02
    text: 商品列表支持 keyword 名称包含匹配与 status 过滤，按 ID 升序，total 为过滤后总数
    quote: "结果按商品 ID 升序排列，`total` 为过滤后的总记录数。"
    api: GET /api/products
  - id: R-PRODUCT-03
    text: 商品详情无需认证，存在返回 200；不存在返回 404 Product not found；product_id 非整数返回 422
    quote: "`product_id` 不是整数"
    api: GET /api/products/{product_id}
  - id: R-PRODUCT-04
    text: 管理员创建商品返回 201，默认 status=on_sale，数据库新增记录且 ID/名称/价格/库存与响应一致
    quote: "数据库验收：必须新增一条商品记录，响应中的 ID、名称、价格、库存和数据库一致。"
    api: POST /api/products
  - id: R-PRODUCT-05
    text: 创建商品时 name 长度 1–100、price>0、stock>=0，违反返回 422，不新增商品
    quote: "`name` 长度为 1–100；"
    api: POST /api/products
  - id: R-PRODUCT-06
    text: 管理员更新商品只更新提交字段，未提交字段保持不变
    quote: "数据库验收：已提交字段被更新，未提交字段保持不变。"
    api: PUT /api/products/{product_id}
  - id: R-PRODUCT-07
    text: 更新商品时商品不存在返回 404，字段违反约束返回 422，数据库不变
    quote: "字段值违反商品约束"
    api: PUT /api/products/{product_id}
  - id: R-PRODUCT-08
    text: 管理员下架商品为软删除，返回 200 和下架后的商品，记录保留且 status=off_sale
    quote: "此操作是软删除，不得物理删除商品记录。"
    api: DELETE /api/products/{product_id}
  - id: R-PRODUCT-09
    text: 商品下架后，引用该商品的历史订单仍可正常查询
    quote: "历史订单对商品的引用必须保持有效。"
    api: DELETE /api/products/{product_id}
  # ---------- PERM ----------
  - id: R-PERM-01
    text: 注册接口只创建普通用户，注册用户无管理员权限
    quote: "注册接口只创建普通用户"
    api: POST /api/auth/register
  - id: R-PERM-02
    text: 普通用户创建商品返回 403，商品数不变
    quote: "商品和优惠券的创建、修改、下架只允许管理员，普通用户调用返回 `403`，数据库不变。"
    api: POST /api/products
  - id: R-PERM-03
    text: 普通用户更新商品返回 403，商品字段不变
    quote: "商品和优惠券的创建、修改、下架只允许管理员，普通用户调用返回 `403`，数据库不变。"
    api: PUT /api/products/{product_id}
  - id: R-PERM-04
    text: 普通用户下架商品返回 403，商品状态不变
    quote: "商品和优惠券的创建、修改、下架只允许管理员，普通用户调用返回 `403`，数据库不变。"
    api: DELETE /api/products/{product_id}
  - id: R-PERM-05
    text: 普通用户创建优惠券返回 403，优惠券数不变
    quote: "创建优惠券（仅管理员，普通用户返回 `403`）"
    api: POST /api/coupons
  - id: R-PERM-06
    text: 未携带 Token 调用商品/优惠券管理接口返回 401，数据库不变
    quote: "商品和优惠券管理接口只允许管理员调用。"
    api: POST /api/products
  # ---------- ORDER ----------
  - id: R-ORDER-01
    text: 正常下单返回 201，amount=round(price*quantity,2)，status=created；库存减 quantity、余额不变（下单不扣余额）、订单数加 1
    quote: "amount = round(product.price * quantity, 2)"
    api: POST /api/orders
  - id: R-ORDER-02
    text: quantity 必须 1–100、product_id 必须为整数，违反返回 422，库存/余额/订单数不变
    quote: "`quantity` 必须大于 0 且不超过 100。"
    api: POST /api/orders
  - id: R-ORDER-03
    text: 商品不存在下单返回 404 Product not found
    quote: "商品存在；"
    api: POST /api/orders
  - id: R-ORDER-04
    text: 商品已下架下单返回 400 Product is not on sale
    quote: "商品状态为 `on_sale`；"
    api: POST /api/orders
  - id: R-ORDER-05
    text: 库存少于购买数量返回 400 Insufficient stock；数量等于库存时成功
    quote: "商品库存不少于购买数量。"
    api: POST /api/orders
  - id: R-ORDER-07
    text: 多个前置条件同时不满足时按 存在→在售→库存 的顺序返回第一个失败的错误（余额不参与下单校验）
    quote: "创建前置条件按顺序为："
    api: POST /api/orders
  - id: R-ORDER-08
    text: 任意前置条件失败时库存、余额和订单总数均不变
    quote: "失败不变量：任意前置条件失败时，库存、余额和订单总数均不得变化。"
    api: POST /api/orders
  - id: R-ORDER-09
    text: 所有订单接口未认证返回 401 Invalid or missing credentials
    quote: "所有订单接口均需要认证。"
    api: POST /api/orders
  - id: R-ORDER-10
    text: 订单列表只返回当前用户订单，按订单 ID 升序
    quote: "只能返回当前用户的订单；"
    api: GET /api/orders
  - id: R-ORDER-11
    text: 订单列表 status 过滤，total 为当前用户过滤后的订单数
    quote: "`total` 是当前用户经过状态过滤后的订单数量。"
    api: GET /api/orders
  - id: R-ORDER-12
    text: 订单列表分页 page>=1、1<=size<=100，越界返回 422
    quote: "`1 <= size <= 100`"
    api: GET /api/orders
  - id: R-ORDER-13
    text: 订单详情返回自己的订单；订单不存在或属于其他用户都返回 404 Order not found
    quote: "其他用户的订单也返回 `404`，避免通过状态码探测资源是否存在。"
    api: GET /api/orders/{order_id}
  - id: R-ORDER-14
    text: 支付 created 订单返回 200，状态改为 paid，余额减少订单金额，库存不变
    quote: "支付当前用户的已创建订单，并按订单金额扣减余额。"
    api: POST /api/orders/{order_id}/pay
  - id: R-ORDER-15
    text: 重复支付返回 409，订单保持 paid，库存和余额不再变化
    quote: "重复支付返回 `409`，订单继续保持 `paid`，不得重复扣库存或余额。"
    api: POST /api/orders/{order_id}/pay
  - id: R-ORDER-16
    text: 支付已取消订单返回 409，状态保持 cancelled，库存余额不变
    quote: "对终态订单再次支付或取消必须返回 `409`。"
    api: POST /api/orders/{order_id}/pay
  - id: R-ORDER-17
    text: 支付不存在或他人的订单返回 404，订单状态不变
    quote: "订单不存在或不属于当前用户"
    api: POST /api/orders/{order_id}/pay
  - id: R-ORDER-18
    text: 取消 created 订单返回 200，状态 cancelled，库存加回 quantity；订单未支付，余额不变（无退款）；库存和余额等于下单前的值
    quote: "订单未支付，取消不涉及退款。从完整业务流程观察，取消完成后的库存和余额应恢复到下单前的值。"
    api: POST /api/orders/{order_id}/cancel
  - id: R-ORDER-19
    text: 已支付或已取消订单再次取消返回 409，库存、余额和状态不变
    quote: "已支付订单和已取消订单不能再次取消；失败后不得重复增加库存或余额。"
    api: POST /api/orders/{order_id}/cancel
  - id: R-ORDER-20
    text: 取消不存在或他人的订单返回 404，订单、库存、余额不变
    quote: "订单不存在或不属于当前用户"
    api: POST /api/orders/{order_id}/cancel
  - id: R-ORDER-21
    text: 支付时余额不少于订单金额才成功（余额等于金额时成功且余额变 0）；余额不足返回 400 Insufficient balance，订单保持 created，库存、余额、订单数不变
    quote: "成功条件：订单当前状态必须为 `created`，且当前用户余额不少于订单金额。"
    api: POST /api/orders/{order_id}/pay
  - id: R-ORDER-22
    text: 多个请求并发购买同一商品时，成功订单总数量不超过下单前库存，库存不为负，库存不足的请求返回 400 Insufficient stock
    quote: "多个请求同时购买同一商品时，成功的订单总数量不得超过下单前库存，库存不得为负；库存不足的请求返回 `400 Insufficient stock`。"
    api: POST /api/orders
  - id: R-ORDER-23
    text: 同一订单并发支付多次时只有一次 200，其余 409，余额只扣一次
    quote: "同一订单被同时支付多次时，只有一次返回 `200`，其余返回 `409`，余额只扣一次；"
    api: POST /api/orders/{order_id}/pay
  - id: R-ORDER-24
    text: 同一用户并发支付多笔订单时余额不为负，余额不足的支付返回 400
    quote: "同一用户同时支付多笔订单时，余额不得为负，余额不足的支付返回 `400`。"
    api: POST /api/orders/{order_id}/pay
  - id: R-ORDER-25
    text: 同一订单并发取消多次时只有一次 200，其余 409，库存只恢复一次，余额不变
    quote: "同一订单被同时取消多次时，只有一次返回 `200`，库存只恢复一次；"
    api: POST /api/orders/{order_id}/cancel
  - id: R-ORDER-26
    text: 同一订单支付与取消并发时只有一个成功，另一个返回 409，库存和余额只按成功的操作变化一次
    quote: "支付和取消同时发生时，只有一个成功，另一个返回 `409`。"
    api: POST /api/orders/{order_id}/cancel
  # ---------- DATA ----------
  - id: R-DATA-01
    text: 下单时扣库存、占用优惠券次数、建订单全部成功或全部失败
    quote: "扣减库存、占用优惠券次数和创建订单必须全部成功或全部失败，不允许部分提交。"
    api: POST /api/orders
  - id: R-DATA-02
    text: 取消时恢复库存、恢复优惠券次数、更新状态全部成功或全部失败
    quote: "恢复库存、恢复优惠券次数和更新订单状态必须全部成功或全部失败。"
    api: POST /api/orders/{order_id}/cancel
  - id: R-DATA-03
    text: 订单金额为创建时快照，商品改价后历史订单金额不变（支付时按原 amount 扣余额）
    quote: "商品后续改价不得修改历史订单金额。"
    api: PUT /api/products/{product_id}
  - id: R-DATA-04
    text: 用户只能查询、支付、取消自己的订单
    quote: "用户只能查询、支付和取消自己的订单。"
    api: GET /api/orders/{order_id}
  - id: R-DATA-05
    text: 非法状态流转不得修改库存、余额或订单状态
    quote: "非法流转不得再次修改库存、余额或订单状态。"
    api: POST /api/orders/{order_id}/pay
  - id: R-DATA-06
    text: 管理员与普通用户一样只能操作自己的订单，查询、支付、取消他人订单返回 404，订单状态和买家余额不变
    quote: "管理员同样只能操作自己的订单，查询、支付、取消他人订单返回 `404`。"
    api: GET /api/orders/{order_id}
  # ---------- CART ----------
  - id: R-CART-01
    text: 所有购物车接口未携带有效 Token 返回 401
    quote: "所有购物车接口都需要 Bearer Token，只能读取和修改当前用户数据。"
    api: GET /api/cart
  - id: R-CART-02
    text: 购物车按用户隔离，查询只返回当前用户的购物车项，修改不影响其他用户
    quote: "购物车必须按用户隔离"
    api: GET /api/cart
  - id: R-CART-03
    text: 添加在售商品到购物车返回 201，新增 cart_items；商品不存在或未在售时不得新增
    quote: "添加商品时商品必须存在且为 `on_sale`"
    api: POST /api/cart/items
  - id: R-CART-04
    text: 同一用户重复添加同一商品时合并为一条，数量相加
    quote: "同一用户重复添加时合并数量。"
    api: POST /api/cart/items
  - id: R-CART-05
    text: 合并后数量必须大于 0 且不超过当前库存，否则返回 400，cart_items 不变
    quote: "合并后的数量必须大于 0 且不超过当前库存，否则返回 `400`，数据库不得变化。"
    api: POST /api/cart/items
  - id: R-CART-06
    text: 购物车请求体 quantity 不满足 0<quantity<=100 或缺字段时返回 422
    quote: "未通过 FastAPI/Pydantic 参数校验时返回 `422`。"
    api: POST /api/cart/items
  - id: R-CART-07
    text: 修改购物车数量成功返回 200，数量被设置为新值
    quote: "修改购物车数量"
    api: PUT /api/cart/items/{product_id}
  - id: R-CART-08
    text: 修改数量时路径 product_id 必须与请求体一致；购物车项不存在返回 404
    quote: "修改数量时路径中的 `product_id` 必须和请求体一致；不存在的购物车项返回 `404`。"
    api: PUT /api/cart/items/{product_id}
  - id: R-CART-09
    text: 删除购物车项成功返回 200 和当前购物车；删除不存在项返回 404
    quote: "删除不存在项返回 `404`。"
    api: DELETE /api/cart/items/{product_id}
  - id: R-CART-10
    text: 清空购物车返回 200 和当前（空）购物车，仅删除当前用户的 cart_items
    quote: "清空和删除操作成功后返回当前购物车；"
    api: DELETE /api/cart
  # ---------- COUPON ----------
  - id: R-COUPON-01
    text: 管理员创建优惠券返回 201，coupons 新增一条，字段与请求一致
    quote: "创建优惠券"
    api: POST /api/coupons
  - id: R-COUPON-02
    text: code 只能含大写字母、数字、下划线、短横线；0<discount_percent<=100；违反返回 422，不新增
    quote: "优惠券 `code` 只能包含大写字母、数字、下划线和短横线，折扣比例为 `0 < discount_percent <= 100`。"
    api: POST /api/coupons
  - id: R-COUPON-03
    text: code 唯一，重复创建返回 409，不新增记录
    quote: "`code` 唯一；重复创建返回 `409`，不得新增记录。"
    api: POST /api/coupons
  - id: R-COUPON-04
    text: GET /api/coupons 返回可用优惠券列表
    quote: "查询可用优惠券"
    api: GET /api/coupons
  - id: R-COUPON-05
    text: 使用优惠券下单，订单保存 coupon_code 和折后金额，库存扣减，券 used_count 加 1，下单时余额不变；支付时按折后金额扣余额
    quote: "订单保存优惠券编码和折后金额，支付时按折后金额扣除余额。"
    api: POST /api/orders
  - id: R-COUPON-06
    text: 折后金额 = round(price*quantity*(1-discount_percent/100), 2)
    quote: "折后金额为 `round(price * quantity * (1 - discount_percent / 100), 2)`；"
    api: POST /api/orders
  - id: R-COUPON-07
    text: 优惠券非 active 或 used_count>=max_uses 时下单返回 400，库存、余额、订单和券次数不变
    quote: "优惠券必须为 active 且 `used_count < max_uses`，否则返回 `400`，库存、余额和订单均不变。"
    api: POST /api/orders
  - id: R-COUPON-08
    text: used_count 达到 max_uses 后优惠券 status=exhausted
    quote: "达到使用次数后优惠券状态为 `exhausted`；"
    api: POST /api/orders
  - id: R-COUPON-09
    text: 取消使用优惠券的订单，used_count 减 1，exhausted 券重新变为 active
    quote: "取消使用该券的订单会恢复次数并重新激活。"
    api: POST /api/orders/{order_id}/cancel
  - id: R-COUPON-10
    text: 使用优惠券但因其他前置条件（库存不足、商品下架）失败时，券 used_count 和状态不变
    quote: "订单、余额、库存和券次数不变"
    api: POST /api/orders
  - id: R-COUPON-11
    text: 并发使用同一优惠券下单时，成功使用次数不超过 max_uses，失败请求返回 400
    quote: "并发使用同一优惠券时，成功使用的次数不得超过 `max_uses`。"
    api: POST /api/orders
  # ---------- INVENTORY ----------
  - id: R-INV-01
    text: 每次成功下单新增一条 quantity_change=-quantity、reason=order_created 的库存流水
    quote: "每次成功下单新增一条 `quantity_change = -quantity`、`reason = order_created` 的流水。"
    api: POST /api/orders
  - id: R-INV-02
    text: 每次成功取消新增一条 quantity_change=+quantity、reason=order_cancelled、reference_id=订单 ID 的流水
    quote: "每次成功取消订单新增一条 `quantity_change = +quantity`、`reason = order_cancelled` 的流水，并关联订单 ID。"
    api: POST /api/orders/{order_id}/cancel
  - id: R-INV-03
    text: 失败的下单、重复支付、非法取消不产生库存流水
    quote: "失败的下单、重复支付、非法取消不得产生库存流水。"
    api: POST /api/orders
  - id: R-INV-04
    text: 库存流水查询需登录，只返回指定商品的流水，商品不存在返回 404
    quote: "查询接口只返回指定商品流水，并要求登录；不存在商品返回 `404`。"
    api: GET /api/inventory/{product_id}/transactions
  # ---------- SEC ----------
  - id: R-SEC-01
    text: JWT 含用户标识、aud=mini-shop、exp；其他服务签发（aud 不同或密钥不同）的 Token 返回 401
    quote: "其他服务签发的 Token 返回 `401`。"
    api: GET /api/auth/me
  - id: R-SEC-02
    text: 密码使用 PBKDF2-SHA256 加盐哈希保存，相同密码的两个用户哈希不同
    quote: "密码使用 PBKDF2-SHA256 加盐哈希保存。"
    api: POST /api/auth/register
  - id: R-SEC-03
    text: 任何 API 响应不得返回密码或密码哈希
    quote: "API 响应不得返回密码或密码哈希。"
    api: GET /api/auth/me
  - id: R-SEC-04
    text: Token、密码和数据库连接串不得出现在测试证据或报告中
    quote: "Token、密码和数据库连接串不得写入测试证据或报告。"
  - id: R-SEC-05
    text: 代码不内置密钥，未配置 APP_SECRET_KEY 时每次启动随机生成（重启后旧 Token 失效）
    quote: "未配置 `APP_SECRET_KEY` 时每次启动随机生成。"
  # ---------- TRACE ----------
  - id: R-TRACE-01
    text: 服务提供 /openapi.json 运行时契约，且与基线契约无破坏性差异
    quote: "FastAPI 必须提供 `/openapi.json` 作为运行时契约。"
  - id: R-TRACE-02
    text: 关键业务测试缺少 HTTP 响应或数据库 before/after 证据时结论为 INCONCLUSIVE
    quote: "缺少关键证据时结论为 `INCONCLUSIVE`，不得判定为 `PASS`。"
  - id: R-TRACE-03
    text: 每个测试请求携带唯一 request_id，测试证据中可按 request_id 关联到对应请求
    quote: "测试请求应携带唯一 `request_id`，用于后续关联日志。"

questions:
  - id: Q-01
    text: 下单时已扣余额，支付（created→paid）是否还会改变余额或库存？需求只写了重复支付不得重复扣，未写首次支付的余额/库存副作用。
    status: answered
    answer: 下单不扣余额，支付（created→paid）时按订单金额扣余额；余额不足支付返回 400 Insufficient balance，订单保持 created。
  - id: Q-02
    text: 第 12 节称"并发下单防超卖"不是当前已实现能力。并发下单同一商品时是否仍要求库存不为负、成功单数不超过库存？若出现超卖应判为缺陷还是已知限制？
    status: answered
    answer: 并发超卖是缺陷，后端已修复；并发下单成功数量不得超过库存，库存不为负。
  - id: Q-03
    text: 并发使用剩余 1 次的优惠券下单（或并发下单耗尽余额）时，是否要求只有一单成功、used_count 不超过 max_uses、余额不为负？
    status: answered
    answer: 是。并发使用同一优惠券成功次数不超过 max_uses；同一用户并发支付多笔订单时余额不得为负，余额不足的返回 400。
  - id: Q-04
    text: 第 12 节称支付和取消无幂等键。同一订单并发支付、并发取消、支付与取消并发时，期望是否为恰好一个成功、其余 409 且库存/余额只变化一次？
    status: answered
    answer: 是。并发支付/并发取消/支付与取消并发时恰好一个成功，其余 409，库存和余额只变化一次。
  - id: Q-05
    text: PUT /api/cart/items/{product_id} 路径 product_id 与请求体不一致时返回什么状态码和 detail（400、409 还是 422）？
    status: open
  - id: Q-06
    text: PUT 修改购物车数量超过当前库存时是否同样返回 400 且数据库不变？13.1 只对"合并后的数量"写了库存约束。修改不在售商品的购物车项如何处理？
    status: open
  - id: Q-07
    text: 添加购物车时商品不存在、商品已下架分别返回什么状态码和 detail（404/400）？
    status: open
  - id: Q-08
    text: GET /api/coupons 是否需要认证？"可用优惠券"是只返回 active，还是也返回 exhausted 等状态？是否分页、排序规则是什么？
    status: open
  - id: Q-09
    text: 新建优惠券的初始 status 和 used_count 是什么（推测 active/0）？除 active/exhausted 外还有哪些状态、如何进入（例如停用）？
    status: open
  - id: Q-10
    text: 下单传入不存在的 coupon_code 返回 400 还是 404，detail 是什么？coupon_code 是否大小写敏感？
    status: open
  - id: Q-11
    text: 优惠券校验在 存在→在售→库存→余额 四个前置条件中的哪个位置？余额校验按原价还是折后金额？
    status: open
  - id: Q-12
    text: 库存流水查询是任意登录用户都可查任意商品，还是仅管理员？流水排序和是否分页？
    status: open
  - id: Q-13
    text: 管理员创建商品或通过 PUT 修改 stock 是否产生库存流水？支付是否产生流水？order_created 流水的 reference_id 是否为订单 ID？
    status: open
  - id: Q-14
    text: 对已下架商品再次 DELETE 返回 200 还是 409？下架商品已在购物车中时购物车项如何处理？
    status: open
  - id: Q-15
    text: 管理员是否可以查询、支付、取消其他用户的订单，还是与普通用户一样返回 404？
    status: answered
    answer: 管理员与普通用户一样，只能操作自己的订单；查询、支付、取消他人订单返回 404。
  - id: Q-16
    text: 普通用户对不存在的商品调用 PUT/DELETE 时返回 403 还是 404（权限与存在性检查顺序）？未认证管理接口是否返回 401 而非 403？
    status: open
  - id: Q-17
    text: 测试环境的管理员账号（APP_ADMIN_USERNAME/APP_ADMIN_PASSWORD）和用于构造过期/伪造 Token 的配置（短有效期或 APP_SECRET_KEY）如何提供给测试？
    status: open
  - id: Q-18
    text: 用户名是否大小写敏感、首尾空格是否裁剪（Alice 与 alice 是否视为重复）？
    status: open
  - id: Q-19
    text: 订单创建后商品被下架或改价，此时支付是否仍允许？取消是否仍按订单 quantity/amount 恢复？
    status: open
  - id: Q-20
    text: '[归属] 第 2 节写"商品和优惠券的创建、修改、下架只允许管理员"，但契约只有 GET/POST /api/coupons。管理员要把已创建券 SAVE10 的 discount_percent 从 10 改为 20、或把它下架，应调用哪个接口（如 PUT /api/coupons/{id}、DELETE /api/coupons/{id}）？若不提供，是否从需求中删掉优惠券的修改/下架？'
    status: open
  - id: Q-21
    text: '[状态终态] off_sale 是否为终态：管理员对已下架商品 PUT /api/products/{id} {"status":"on_sale"} 是返回 200 并重新上架，还是 409？对 off_sale 商品 PUT {"price":129.0} 返回 200 还是 409？'
    status: open
  - id: Q-22
    text: '[幂等与重复] 库存 10 时同一买家连续两次提交完全相同的 POST /api/orders {"product_id":1,"quantity":2}（无幂等键），结果是创建 2 个订单、库存变为 6，还是第二次被拒绝（返回哪个状态码）？'
    status: open
  - id: Q-23
    text: '[幂等与重复] 管理员连续两次 POST /api/products {"name":"Keyboard","price":99.0,"stock":10}，第二次是返回 201 并新增第二条同名商品，还是返回 409？'
    status: open
  - id: Q-24
    text: '[幂等与重复] 同一买家用 max_uses=5 的券 SAVE10 连续下 2 单，第二单是返回 201 且 used_count=2，还是因每人限用 1 次返回 400？'
    status: open
  - id: Q-25
    text: '[并发] 管理员 DELETE /api/products/{id} 下架与买家 POST /api/orders 购买该商品同时发生时，是否允许出现"订单 201、status=created，但商品已 off_sale"？出现时判为缺陷还是允许？'
    status: open
  - id: Q-26
    text: '[并发] 商品库存 10 时，管理员 PUT /api/products/{id} {"stock":5} 与买家下单 3 件同时发生，最终库存应为 5、2 还是 7？下单成功后库存是否允许被管理员直接覆盖？'
    status: open
  - id: Q-27
    text: '[并发] 库存 5 的商品在买家购物车中已有 3 件，该买家并发发出 2 次 POST /api/cart/items 各加 2 件，是否要求恰好 1 个 201、1 个 400，最终 quantity=5（不得出现 7）？'
    status: open
  - id: Q-28
    text: '[金额与数值] 订单金额舍入方式：price=1.005、quantity=1 时 amount 是 1.01（十进制四舍五入）还是 1.0（Python round 对二进制浮点的结果）？price=0.125、quantity=1 时是 0.13 还是 0.12（银行家舍入）？'
    status: open
  - id: Q-29
    text: '[金额与数值] 创建商品 price=9.999（3 位小数）是返回 422，还是 201 并保存为 9.999 或 10.0？price=100000000、stock=2147483648 是否允许，price 和 stock 的上限各是多少？'
    status: open
  - id: Q-30
    text: '[金额与数值] 余额 1000.00 的买家依次支付 3 笔 amount=0.1 的订单后，响应和数据库中的 balance 应为 999.7 还是 999.6999999999999？余额是否始终保留 2 位小数？'
    status: open
  - id: Q-31
    text: '[金额与数值] 创建优惠券 max_uses=0、max_uses=-1、max_uses=1.5 时返回 422 还是 201？max_uses 有无上限？discount_percent=12.345（3 位小数）返回 201 还是 422？'
    status: open
  - id: Q-32
    text: '[时间] created_at 的时区：响应应为 "2026-09-01T08:00:00Z"（UTC 带 Z），还是不带时区的 "2026-09-01T16:00:00"（服务器本地时间）？数据库中按 UTC 还是本地时间保存？'
    status: open
  - id: Q-33
    text: '[时间] created 订单是否有支付时限：下单后 30 分钟（或多少分钟）未支付是否自动变为 cancelled 并恢复库存？若没有时限，created 订单可以无限期占用库存吗？'
    status: open
  - id: Q-34
    text: '[时间] 优惠券是否有有效期字段（如 starts_at/expires_at）？若有，创建 expires_at 为昨天的券返回 422 还是 201，用已过期的券下单是否返回 400？'
    status: open
  - id: Q-35
    text: '[时间] 购物车项是否会过期：加入购物车后 7 天未操作的 cart_item 是否仍保留在 GET /api/cart 结果中？'
    status: open
  - id: Q-36
    text: '[级联影响] 商品改价 99.0→129.0 后，GET /api/cart 中该项显示的单价是 129.0（实时价）还是加入时的 99.0？管理员把库存从 10 改为 2 后，购物车中 quantity=5 的项是保留为 5、自动改为 2，还是被删除？'
    status: open
  - id: Q-37
    text: '[级联影响] 买家购物车中有商品 A×2，随后直接 POST /api/orders 购买 A×2 成功，购物车中 A 的项是仍保留 quantity=2，还是被移除或扣减？'
    status: open
  - id: Q-38
    text: '[审计与可追溯] 支付订单扣减余额 198.0 时，是否需要记录一条余额流水（关联 user_id、order_id、变动 -198.0）？还是只以 orders.status=paid 和 users.balance 的前后差值作为证据？'
    status: open

