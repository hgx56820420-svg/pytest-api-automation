  - id: TC-PRODUCT-007
    test_points: [TP-PRODUCT-04-01, TP-PRODUCT-04-02]
    title: 管理员创建商品
    steps: ["记录 products 行数", "管理员 POST /api/products name=Keyboard price=99.0 stock=10"]
    expected: "201；status == on_sale；products 行数 +1；数据库该行 name/price/stock 与响应一致"
