  - {id: TP-COUPON-02-01, rule: R-COUPON-02, dimension: boundary, text: discount_percent=0.01 和 100 成功；0、-1、100.01 返回 422}
  - {id: TP-COUPON-02-02, rule: R-COUPON-02, dimension: invalid_input, text: code 含小写字母、空格、点号或中文，缺 code/discount_percent/max_uses 时返回 422}
  - {id: TP-COUPON-02-03, rule: R-COUPON-02, dimension: side_effect, text: 422 后 coupons 数不变}
  - {id: TP-COUPON-03-01, rule: R-COUPON-03, dimension: state, text: 已存在 code 再次创建返回 409}
  - {id: TP-COUPON-03-02, rule: R-COUPON-03, dimension: side_effect, text: 409 后该 code 仍只有一条，原券字段不变}
  - {id: TP-COUPON-03-03, rule: R-COUPON-03, dimension: concurrency, text: 并发 5 次创建同一 code，只有 1 个 201，其余 409，数据库一条}
  - {id: TP-COUPON-04-01, rule: R-COUPON-04, dimension: happy, text: 创建的 active 券出现在 GET /api/coupons 结果中，字段与数据库一致}
  - {id: TP-COUPON-05-01, rule: R-COUPON-05, dimension: happy, text: 价格 100 购买 2 件使用 10% 券下单返回 201，amount=180.0，coupon_code=该券}
  - {id: TP-COUPON-05-02, rule: R-COUPON-05, dimension: side_effect, text: 下单时余额不变、库存减 2、订单数加 1、券 used_count 加 1；支付该订单后余额减 180.0}
  - {id: TP-COUPON-06-01, rule: R-COUPON-06, dimension: boundary, text: 100% 券 amount=0.0 且支付后余额不变；价格 9.99 买 3 件 10% 券 amount=26.97（26.973 取两位），支付后余额减 26.97}
  - {id: TP-COUPON-07-01, rule: R-COUPON-07, dimension: state, text: max_uses=1 的券使用一次后再次下单返回 400}
  - {id: TP-COUPON-07-02, rule: R-COUPON-07, dimension: side_effect, text: 400 后库存、余额、订单数、券 used_count 和 status 均不变}
  - {id: TP-COUPON-08-01, rule: R-COUPON-08, dimension: state, text: max_uses=2 的券第 1 次使用后仍为 active、used_count=1；第 2 次后 status=exhausted、used_count=2}
  - {id: TP-COUPON-09-01, rule: R-COUPON-09, dimension: state, text: 用 max_uses=1 的券下单使其 exhausted，取消该订单后 status 恢复为 active}
  - {id: TP-COUPON-09-02, rule: R-COUPON-09, dimension: side_effect, text: 取消后 used_count 减 1，余额不变（未支付无退款），券可再次用于下单}
  - {id: TP-COUPON-10-01, rule: R-COUPON-10, dimension: side_effect, text: 带有效券下单但库存不足、商品下架时返回 400，券 used_count 和 status 不变}
  - {id: TP-COUPON-11-01, rule: R-COUPON-11, dimension: concurrency, text: max_uses=1 的券 5 个买家并发带券下单，恰好 1 个 201、4 个 400，used_count=1，带券订单 1 条，库存只减 1}
  - {id: TP-INV-01-01, rule: R-INV-01, dimension: happy, text: 下单 3 件后查询流水，含一条 quantity_change=-3、reason=order_created}
  - {id: TP-INV-01-02, rule: R-INV-01, dimension: side_effect, text: 每次成功下单库存流水数加 1，流水 product_id 正确}
  - {id: TP-INV-02-01, rule: R-INV-02, dimension: happy, text: 取消 3 件的订单后流水含 quantity_change=+3、reason=order_cancelled、reference_id=订单 ID}
  - {id: TP-INV-02-02, rule: R-INV-02, dimension: side_effect, text: 取消后流水数加 1，该商品流水 quantity_change 之和等于 0}
  - {id: TP-INV-03-01, rule: R-INV-03, dimension: side_effect, text: 库存不足/下架/券耗尽的下单、重复支付、取消已支付或已取消订单后，流水数不变}
  - {id: TP-INV-04-01, rule: R-INV-04, dimension: happy, text: 两个商品各自下单，查询商品 A 流水只返回 product_id=A 的记录}
  - {id: TP-INV-04-02, rule: R-INV-04, dimension: permission, text: 不带 Token 查询库存流水返回 401（普通用户是否可查见 Q-12）}
  - {id: TP-INV-04-03, rule: R-INV-04, dimension: invalid_input, text: 不存在商品返回 404；product_id=abc 返回 422}
  - {id: TP-SEC-01-01, rule: R-SEC-01, dimension: permission, text: aud 不是 mini-shop、缺 aud、缺 exp、用其他密钥签名的 JWT 访问 /api/auth/me 返回 401}
  - {id: TP-SEC-02-01, rule: R-SEC-02, dimension: side_effect, text: password_hash 为 PBKDF2-SHA256 格式并含盐；两个用户使用相同密码时哈希不同}
  - {id: TP-SEC-03-01, rule: R-SEC-03, dimension: happy, text: 注册、登录、me、订单、购物车响应中均不含 password 和 password_hash 字段或值}
  - {id: TP-SEC-04-01, rule: R-SEC-04, dimension: side_effect, text: 检查测试报告和证据文件中不含 Token、明文密码、数据库连接串}
  - {id: TP-SEC-05-01, rule: R-SEC-05, dimension: permission, text: 未配置 APP_SECRET_KEY 时重启服务，重启前签发的 Token 返回 401；代码中无硬编码密钥}
  - {id: TP-TRACE-01-01, rule: R-TRACE-01, dimension: happy, text: GET /openapi.json 返回 200，与 contracts/mini_shop.openapi.json 比较无破坏性差异}
  - {id: TP-TRACE-02-01, rule: R-TRACE-02, dimension: happy, text: 关键业务用例缺少数据库快照时报告结论为 INCONCLUSIVE 而非 PASS}
  - {id: TP-TRACE-03-01, rule: R-TRACE-03, dimension: happy, text: "一次测试运行中每个请求都带 request_id，所有 request_id 互不相同，且报告证据中的每条 HTTP 记录都有 request_id"}

# ④ 测试用例
cases:
  - id: TC-META-001
    test_points: [TP-META-01-01]
    title: 健康检查
    steps: ["不带 Authorization 调用 GET /health"]
    expected: "200；body.status == ok"
    testable: api
  - id: TC-META-002
    test_points: [TP-META-02-01]
    title: 时间字段为 ISO 8601
    steps: ["随机用户注册", "管理员创建商品", "买家下单 1 件", "GET /api/orders/{id} 与 GET /api/products/{id}"]
    expected: "注册、商品、下单、订单详情响应的 created_at 均为字符串，且能被 datetime.fromisoformat 解析（Z 后缀按 +00:00 处理）"
    testable: api
  - id: TC-AUTH-001
    test_points: [TP-AUTH-01-01, TP-AUTH-01-02]
    title: 正常注册
    steps: ["记录 users 表行数", "用随机 8 位用户名和密码 Test123456 注册"]
    expected: "201；响应含 id、username 等于请求值、balance == 1000.0、created_at 为 ISO 8601；users 行数 +1，该行 balance == 1000.00"
    testable: api
  - id: TC-AUTH-002
    test_points: [TP-AUTH-02-01, TP-AUTH-02-03]
    title: 注册用户名与密码长度边界
    steps: ["分别注册 username 长度 3、20（密码 6、32 位）", "分别注册 username 长度 2、21，password 长度 5、33", "每次记录 users 行数"]
    expected: "长度 3/20 与 6/32 返回 201；长度 2/21 与 5/33 返回 422，users 行数不变"
    testable: api
  - id: TC-AUTH-003
    test_points: [TP-AUTH-02-02, TP-AUTH-02-03]
    title: 注册请求体缺字段或类型错误
    steps: ["分别发送缺 username、缺 password、username 为整数、空 body 的注册请求"]
    expected: "均返回 422；users 行数不变"
    testable: api
  - id: TC-AUTH-004
    test_points: [TP-AUTH-03-01, TP-AUTH-03-02]
    title: 重复用户名注册
    steps: ["注册用户 U（密码 P1）", "记录 U 的数据库行与 users 行数", "用相同用户名、密码 P2 再次注册"]
    expected: "第二次返回 409，detail == Username already exists；users 行数不变，U 的 password_hash 与 balance 不变，P1 仍可登录"
    testable: api
  - id: TC-AUTH-005
    test_points: [TP-AUTH-03-03]
    title: 并发同名注册
    steps: ["用 ThreadPoolExecutor 并发 10 个相同用户名的注册请求"]
    expected: "恰好 1 个 201，其余 9 个 409；数据库该用户名只有 1 行"
    testable: api
  - id: TC-AUTH-006
    test_points: [TP-AUTH-04-01]
    title: 密码不以明文保存或返回
    steps: ["注册用户，密码 Test123456", "读取数据库 users.password_hash", "检查注册响应体"]
    expected: "password_hash 非空且不等于、不包含 Test123456；响应无 password、password_hash 键，响应文本不含明文密码"
    testable: api
  - id: TC-AUTH-007
    test_points: [TP-AUTH-05-01, TP-AUTH-05-02]
    title: 正常登录
    steps: ["注册用户并记录余额、订单数、商品数", "用正确用户名密码登录", "用返回的 token 调 GET /api/auth/me"]
    expected: "登录 200，access_token 非空，token_type == bearer；me 返回 200 且 username 一致；余额、订单数、商品数不变"
    testable: api
  - id: TC-AUTH-008
    test_points: [TP-AUTH-06-01]
    title: 错误密码与不存在用户返回相同错误
    steps: ["已注册用户用错误密码登录", "用不存在的随机用户名登录"]
    expected: "两者均为 401，detail == Incorrect username or password，两个响应体完全相同"
    testable: api
  - id: TC-AUTH-009
    test_points: [TP-AUTH-07-01]
    title: 登录请求体校验
    steps: ["分别发送缺 username、缺 password、空 body、password 为整数的登录请求"]
    expected: "均返回 422"
    testable: api
  - id: TC-AUTH-010
    test_points: [TP-AUTH-08-01]
    title: 查询当前用户
    steps: ["注册并登录", "GET /api/auth/me"]
    expected: "200；id、username、balance、created_at 与数据库一致；响应不含 password_hash"
    testable: api
  - id: TC-AUTH-011
    test_points: [TP-AUTH-09-01]
    title: 无效 Token 访问 me
    steps: ["分别以无 Authorization、Authorization 为 Token xxx、Bearer 随机串、篡改有效 JWT 签名段调用 GET /api/auth/me"]
    expected: "均 401；响应头 WWW-Authenticate == Bearer；detail == Invalid or missing credentials"
    testable: api
  - id: TC-AUTH-012
    test_points: [TP-AUTH-09-01]
    title: Token 对应用户不存在
    steps: ["注册用户并登录得到 token", "从数据库删除该用户", "用该 token 调 GET /api/auth/me"]
    expected: "401；WWW-Authenticate == Bearer；detail == Invalid or missing credentials"
    testable: api
  - id: TC-AUTH-013
    test_points: [TP-AUTH-10-01]
    title: Token 过期
    steps: ["在 Token 有效期配置为 1 分钟的环境登录", "等待超过 1 分钟后调用 GET /api/auth/me"]
    expected: "过期前 200，过期后 401 且 detail == Invalid or missing credentials"
    testable: manual
    reason: 需要修改服务的 Token 有效期配置或等待 60 分钟，测试环境如何提供见 Q-17
  - id: TC-PRODUCT-001
    test_points: [TP-PRODUCT-01-01]
    title: 商品列表默认分页
    steps: ["管理员创建 1 个商品", "不带 Token GET /api/products"]
    expected: "200；page == 1，size == 10，len(items) <= 10，含 total 字段"
    testable: api
  - id: TC-PRODUCT-002
    test_points: [TP-PRODUCT-01-02]
    title: 商品列表分页边界
    steps: ["请求 size=1、size=100、page=1", "请求 size=0、size=101、page=0"]
    expected: "前三个 200 且 len(items) <= size；后三个 422"
    testable: api
  - id: TC-PRODUCT-003
    test_points: [TP-PRODUCT-01-03]
    title: 商品列表非法参数
    steps: ["请求 page=abc、size=1.5、status=deleted"]
    expected: "均返回 422"
    testable: api
  - id: TC-PRODUCT-004
    test_points: [TP-PRODUCT-02-01]
    title: 商品列表关键词与状态过滤
    steps: ["管理员创建含唯一前缀 K 的 3 个商品，下架其中 1 个", "GET /api/products?keyword=K", "GET /api/products?keyword=K&status=on_sale", "GET /api/products?keyword=K&status=off_sale"]
    expected: "keyword 查询 total == 3；on_sale total == 2，off_sale total == 1；items 名称都包含 K、status 与过滤值一致、id 升序"
    testable: api
  - id: TC-PRODUCT-005
    test_points: [TP-PRODUCT-03-01]
    title: 查询商品详情
    steps: ["管理员创建商品", "不带 Token GET /api/products/{id}"]
    expected: "200；id、name、price、stock、status 与数据库一致"
    testable: api
  - id: TC-PRODUCT-006
    test_points: [TP-PRODUCT-03-02]
    title: 查询不存在或非法商品 ID
    steps: ["GET /api/products/{数据库最大 id + 1000}", "GET /api/products/abc"]
    expected: "前者 404，detail == Product not found；后者 422"
