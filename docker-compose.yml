services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY}
      - APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME:-}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
