name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    # 接口兼容性：当前代码导出的 OpenAPI 和仓库里的基线对比，有破坏性变更就失败
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/export_openapi.py build/openapi
      - name: Check breaking changes with oasdiff
        run: |
          status=0
          for current in build/openapi/*.openapi.json; do
            baseline="contracts/$(basename "$current")"
            if [ ! -f "$baseline" ]; then
              echo "::error::missing baseline $baseline. Run 'python scripts/export_openapi.py contracts' and commit it in this PR."
              status=1
              continue
            fi
            echo "== $baseline"
            docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff:v1.37.0 \
              breaking "$baseline" "$current" --fail-on ERR || status=1
          done
          exit $status

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      # 需求规则 → 覆盖矩阵 → 测试点 → 用例 → pytest 的链条是否完整
      - run: python scripts/check_cases.py cases/*.yaml
      # 无断言、常量断言、吞异常、缺用例编号、该查库没查库
      - run: python scripts/check_tests.py
      # tests/conftest.py 会用临时数据库自动启动三个演示服务
      - run: python -m pytest --junitxml=artifacts/junit.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/
          if-no-files-found: warn
